# ================================================================================
# VEXT AUDIT CAPITAL — GOOGLE CLOUD BUILD DEPLOYMENT SPECIFICATION (CI/CD)
# ================================================================================
# This file automates building the enterprise container image, storing it in Artifact Registry,
# and deploying it securely to Google Cloud Run serverlessly with automatic scale-to-zero capabilities.

steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/vext-api-gateway:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/vext-api-gateway:latest',
      '.'
    ]

  # 2. Push the Docker image to Google Container/Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vext-api-gateway:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vext-api-gateway:latest']

  # 3. Deploy the container serverlessly to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'vext-api-gateway',
      '--image', 'gcr.io/$PROJECT_ID/vext-api-gateway:$COMMIT_SHA',
      '--region', 'asia-south1', # Mumbai, India GCP region
      '--platform', 'managed',
      '--allow-unauthenticated', # Enable web intake endpoints to receive direct public traffic
      '--max-instances', '100',  # Bound auto-scaling to manage billing safety margins
      '--min-instances', '0',    # Support direct scale-to-zero when idle (near-zero operating cost!)
      '--service-account', 'vext-api-gateway-sa@$PROJECT_ID.iam.gserviceaccount.com'
    ]

images:
  - 'gcr.io/$PROJECT_ID/vext-api-gateway:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vext-api-gateway:latest'

services:
  - type: worker
    name: vext-agents-orchestrator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python agents/run_all_agents.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
